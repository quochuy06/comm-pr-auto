name: Build va push image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comm-pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            component: backend
            dockerfile: deploy/backend.Dockerfile
          - service: web
            component: frontend
            dockerfile: deploy/frontend.Dockerfile
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: comm_pr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d comm_pr_ci"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/comm_pr_ci
      N8N_CALLBACK_SECRET: ci-only-callback-secret-not-a-production-credential
      N8N_BASE_URL: http://127.0.0.1:9
      RUN_DB_TESTS: 'true'
      COOKIE_SECURE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.service == 'backend'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend API and database tests
        if: matrix.service == 'backend'
        working-directory: backend
        run: |
          npm ci
          npm run db:generate
          npm run db:migrate
          node --input-type=module -e 'import p from "./src/prisma.js"; await p.settings.upsert({where:{id:"default"},create:{id:"default"},update:{}}); await p.$disconnect();'
          node --test --test-concurrency=1 test/*.test.js
      - name: Deployment safety tests
        if: matrix.service == 'backend'
        run: python3 -m unittest deploy/test_vps.py deploy/test_cd.py deploy/test_migrate_release.py deploy/test_facebook_credentials.py
      - name: Frontend lint
        if: matrix.service == 'web'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/comm-pr-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy len VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST || '160.250.180.238' }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_KEY" || { echo 'Configure VPS_DEPLOY_KEY first'; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'Configure VPS_KNOWN_HOSTS first'; exit 1; }
          mkdir -p "$RUNNER_TEMP/commpr-release"
          for service in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/comm-pr-$service:$GITHUB_SHA"
            docker pull "$image"
            docker tag "$image" "comm-pr-$service:$GITHUB_SHA"
          done
          python3 deploy/release_manifest.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/commpr-release/manifest.json"
          docker save "comm-pr-backend:$GITHUB_SHA" "comm-pr-frontend:$GITHUB_SHA" -o "$RUNNER_TEMP/commpr-release/images.tar"
          tar -C "$RUNNER_TEMP/commpr-release" -czf "$RUNNER_TEMP/commpr-release.tar.gz" images.tar manifest.json
          ssh_dir="$RUNNER_TEMP/commpr-ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          options=(-i "$ssh_dir/key" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          ssh "${options[@]}" "commpr-deploy@$VPS_HOST" "upload $GITHUB_SHA" < "$RUNNER_TEMP/commpr-release.tar.gz"
          ssh "${options[@]}" "commpr-deploy@$VPS_HOST" "deploy $GITHUB_SHA"
      - name: Health check
        run: |
          set -euo pipefail
          for path in /health /login; do
            code=000
            for _ in 20; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://top2lowcode.io.vn$path" || true)
              [ "$code" = 200 ] && break
              sleep 5
            done
            [ "$code" = 200 ] || { echo "health check failed: $path -> $code"; exit 1; }
          done
