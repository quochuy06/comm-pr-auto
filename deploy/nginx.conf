server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # Container callbacks use the internal backend address, never this public edge.
    location ^~ /api/webhooks/ { return 404; }
    location ^~ /api/workflow-internal/ { return 404; }
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 240s;
    }
    location /media/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }
    location = /health { proxy_pass http://backend:5000/health; }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
